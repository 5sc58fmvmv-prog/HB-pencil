name: Refresh Letterboxd feed

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Refresh feed JSON
        run: python scripts/update_letterboxd_feed.py
      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add letterboxd-feed.json
          if git diff --cached --quiet; then
            echo "Letterboxd feed is unchanged"
            exit 0
          fi
          git commit -m "Refresh Letterboxd diary feed"
          git push
